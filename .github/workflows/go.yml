name: Go

on: [push, pull_request]

env:
  GOTOOLCHAIN: local

jobs:
  lint:
    runs-on: ${{ github.event_name == 'pull_request' && 'ubuntu-latest' || fromJSON('["self-hosted","Linux","ARM64","macbook-air-linux"]') }}
    strategy:
      fail-fast: false
      matrix:
        go-version: ["1.25", "1.26"]
    name: Lint ${{ matrix.go-version == '1.26' && '(latest)' || '(old)' }}

    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go-version }}
          cache: true

      - name: Install libolm
        run: sudo apt-get install libolm-dev libolm3

      - name: Install dependencies
        run: |
          # Keep the lint toolchain compatible with the oldest supported Go version.
          go install golang.org/x/tools/cmd/goimports@v0.43.0
          go install honnef.co/go/tools/cmd/staticcheck@v0.7.0
          export PATH="$HOME/go/bin:$PATH"

      - name: Run pre-commit
        uses: pre-commit/action@v3.0.1

  test:
    runs-on: ${{ github.event_name == 'pull_request' && 'ubuntu-latest' || fromJSON('["self-hosted","Linux","ARM64","macbook-air-linux"]') }}
    strategy:
      fail-fast: false
      matrix:
        go-version: ["1.25", "1.26"]
    name: Test (${{ matrix.go-version == '1.26' && 'latest' || 'old' }})

    steps:
      - uses: actions/checkout@v6

      - name: Set up Go ${{ matrix.go-version }}
        uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go-version }}
          cache: true

      - name: Install libolm
        run: sudo apt-get install libolm-dev libolm3

      - name: Test
        # Preserve compiler diagnostics and the test exit status; C warnings are not JSON.
        run: go test -v ./...
